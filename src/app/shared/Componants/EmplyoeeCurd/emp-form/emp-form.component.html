<div class="row d-flex justify-content-center">
    <div class="col-md-6">
        <div class="card">
    <div class="card-body">
        <h2>{{isInEditMode ? "Update Details" : "Add Details"}}</h2>
       <form 
       [formGroup]="empForm" (ngSubmit)="onEmpAdd()"
       >
       <div class="form-group">
        <label for="title">Title</label>
        <input formControlName="title" type="text" class="form-control"/>
       </div>
       <div class="form-group">
        <label for="email">Email<sup>*</sup></label>
        <input formControlName="email" class="form-control"/>
       </div>
        <div class="form-group">
        <label for="role">Role</label>
        <input formControlName="role" type="text" class="form-control"/>
         </div>
        <div class="form-group">
        <label for="avatar">Image Url</label>
        <input formControlName="avatar" type="text" class="form-control"/>
       </div>
        <div class="form-group">
        <label for="salary">Salary</label>
        <input formControlName="salary" type="text" class="form-control"/>
       </div>
         <button 
         *ngIf="!isInEditMode"
         mat-raised-button color="primary" type="submit" class="w-100">
         Add Employee
        </button>
        <button 
        (click)="onEmpUpdate()"
         *ngIf="isInEditMode"
         mat-raised-button color="accent" type="button" class="w-100">
         Update Employee
        </button>
       </form> 
    </div>
</div>
</div>
</div>
